[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "capaxion-core"
version = "0.1.0"
description = "CAPAXION manufacturing decision and control core"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.16,<2",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.13,<3",
  "openpyxl>=3.1,<4",
  "onnxruntime>=1.30,<2",
  "pypdf>=6.18,<7",
  "python-docx>=1.2,<2",
  "rapidocr>=3.9,<4"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.22,<1",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_mes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
