<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产能与能力 · CAPAXION</title><style>
:root{--bg:#07131c;--panel:#0d1d29;--line:#203a48;--text:#e6f0f3;--muted:#91a7b0;--cyan:#58dec9;--blue:#62aef8;--red:#ff9aa5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -20%,#174253 0,transparent 40%),var(--bg);color:var(--text);font:13px/1.5 Inter,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}.shell{max-width:1500px;margin:auto;padding:24px}.top,.row,.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:18px}h1{font-size:25px;margin:2px 0}.muted,label{color:var(--muted)}.btn{color:var(--text);text-decoration:none;border:1px solid #2a5a67;background:#102b37;border-radius:9px;padding:8px 12px;cursor:pointer}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#06231d;font-weight:800}.btn:disabled{opacity:.42;cursor:not-allowed}.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#102631,#0b1a25);overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.body{padding:16px}.toolbar input{min-width:260px;flex:1}.field,input,select{border:1px solid #294b58;background:#071722;color:var(--text);border-radius:8px;padding:9px}.table-wrap{overflow:auto;max-height:calc(100vh - 220px)}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px 13px;border-bottom:1px solid #17303b;text-align:left}th{position:sticky;top:0;background:#0c202b;color:var(--muted);z-index:2}.badge{padding:3px 8px;border-radius:99px;background:#173846;color:#c7e7e4;font-size:10px;font-weight:800}.off{background:#45242a;color:var(--red)}dialog{width:min(620px,calc(100% - 24px));border:1px solid var(--line);border-radius:14px;padding:0;background:#0d1d29;color:var(--text)}dialog::backdrop{background:#02080dcc}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:5px}.span{grid-column:1/-1}.notice{min-height:22px;color:#ffd27d}.identity select{background:transparent}.empty{text-align:center;color:var(--muted);padding:40px}@media(max-width:700px){.shell{padding:12px}.form{grid-template-columns:1fr}.span{grid-column:auto}}
</style></head><body><main class="shell"><header class="top"><div><div class="muted">RESOURCE CAPABILITY REGISTRY</div><h1>产能与能力管理</h1><div class="muted">人员、工作单元及其可执行工序；每次修改都有版本与审计记录</div></div><div class="row"><a class="btn primary" href="/workspace">Agent 工作台</a><a class="btn" href="/">控制塔</a><a class="btn" href="/planning">排产中心</a><a class="btn" href="/planning/results">排产结果</a><span class="identity"><span class="muted">当前身份</span><select id="actor"></select></span><button class="btn" id="create">新增资源</button></div></header><div class="notice" id="notice"></div><section class="panel"><div class="head"><strong>WS-MACH-01 · 可排产资源</strong><span class="badge" id="count">0</span></div><div class="body toolbar"><input id="search" placeholder="搜索编号、名称、工作中心或能力"><select id="type"><option value="">全部类型</option><option>PERSON</option><option>CELL</option></select><select id="active"><option value="">全部状态</option><option value="true">启用</option><option value="false">停用</option></select><button class="btn" id="refresh">刷新</button></div><div class="table-wrap"><table><thead><tr><th>资源</th><th>类型</th><th>工作中心</th><th>正常 / 最大产能</th><th>能力工序</th><th>状态</th><th>版本</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<dialog id="dialog"><div class="head"><strong id="dialogTitle">编辑资源</strong><button class="btn" onclick="dialog.close()">关闭</button></div><form class="body form" id="form"><label>资源编号<input id="code" maxlength="64" required></label><label>类型<select id="resourceType"><option>PERSON</option><option>CELL</option></select></label><label>名称<input id="name" maxlength="160" required></label><label>工作中心<input id="workCenter" required></label><label>正常产能（分钟/工作日）<input id="daily" type="number" min="1" required></label><label>含加班上限（分钟/工作日）<input id="overtime" type="number" min="1" required></label><label class="span">能力工序（逗号分隔）<input id="capabilities" placeholder="TURN, GRIND；* 表示该工作中心全部工序"></label><label class="row span"><input id="enabled" type="checkbox" checked style="width:auto">启用该资源</label><div class="span row"><button class="btn primary" type="submit">保存</button><span class="muted" id="versionHint"></span></div></form></dialog>
<script>
const $=id=>document.getElementById(id),state={items:[],editing:null,identity:null},dialog=$("dialog");function actorId(){return sessionStorage.getItem("mes_dev_actor")||"demo-planner"}function canPlan(){return state.identity?.roles?.includes("PLANNER")}async function api(path,options={}){const h=new Headers(options.headers||{});h.set("X-Dev-Actor",actorId());const r=await fetch(path,{...options,headers:h});if(!r.ok){const b=await r.json().catch(()=>({detail:r.statusText}));throw Error(b.detail||r.statusText)}return r.json()}function msg(t,e=false){$("notice").textContent=t;$("notice").style.color=e?"var(--red)":"#ffd27d"}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function init(){const auth=await fetch("/api/v1/system/auth-config").then(r=>r.json());$("actor").replaceChildren(...auth.devProfiles.map(p=>{const o=document.createElement("option");o.value=p.subjectId;o.textContent=p.displayName;o.selected=p.subjectId===actorId();return o}));await load()}async function load(){[state.identity,state.items]=await Promise.all([api("/api/v1/identity/me"),api("/api/v1/planning/resources?workshopId=WS-MACH-01")]);$("create").disabled=!canPlan();$("create").title=canPlan()?"新增产能资源":"当前身份没有计划员权限";render()}
function render(){const q=$("search").value.toLowerCase(),kind=$("type").value,active=$("active").value;const rows=state.items.filter(x=>(!q||[x.code,x.name,x.workCenterId,...x.capabilityCodes].join(" ").toLowerCase().includes(q))&&(!kind||x.resourceType===kind)&&(!active||String(x.active)===active));$("count").textContent=`${rows.length} / ${state.items.length}`;$("rows").innerHTML=rows.length?rows.map(x=>`<tr><td><strong>${esc(x.code)}</strong><br><span class="muted">${esc(x.name)}</span></td><td><span class="badge">${x.resourceType}</span></td><td>${esc(x.workCenterId)}</td><td>${x.dailyCapacityMinutes} / ${x.overtimeCapacityMinutes}</td><td>${esc(x.capabilityCodes.join("、")||"同工作中心全部")}</td><td><span class="badge ${x.active?"":"off"}">${x.active?"启用":"停用"}</span></td><td>v${x.version}</td><td><button class="btn" onclick="edit('${x.resourceId}')" ${canPlan()?"":"disabled title='需要计划员权限'"}>修改</button></td></tr>`).join(""):`<tr><td colspan="8" class="empty">没有匹配资源</td></tr>`}
function openForm(x=null){state.editing=x;$("dialogTitle").textContent=x?`修改 ${x.code}`:"新增产能资源";$("code").value=x?.code||"";$("code").disabled=!!x;$("resourceType").value=x?.resourceType||"PERSON";$("resourceType").disabled=!!x;$("name").value=x?.name||"";$("workCenter").value=x?.workCenterId||"WC-LATHE-01";$("daily").value=x?.dailyCapacityMinutes||480;$("overtime").value=x?.overtimeCapacityMinutes||600;$("capabilities").value=x?.capabilityCodes.join(", ")||"TURN";$("enabled").checked=x?.active??true;$("versionHint").textContent=x?`基于版本 v${x.version} 保存；冲突时要求刷新重试`:"资源编号和类型创建后保持稳定";dialog.showModal()}window.edit=id=>openForm(state.items.find(x=>x.resourceId===id));$("form").onsubmit=async e=>{e.preventDefault();try{const common={name:$("name").value,workCenterId:$("workCenter").value,dailyCapacityMinutes:Number($("daily").value),overtimeCapacityMinutes:Number($("overtime").value),capabilityCodes:$("capabilities").value.replace(/，/g,",").split(",").map(x=>x.trim()).filter(Boolean)};if(state.editing){await api(`/api/v1/planning/resources/${state.editing.resourceId}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({...common,expectedVersion:state.editing.version,active:$("enabled").checked})})}else{await api("/api/v1/planning/resources",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...common,code:$("code").value,resourceType:$("resourceType").value,workshopId:"WS-MACH-01"})})}dialog.close();msg(state.editing?"产能已更新并产生审计事件":"产能资源已创建");await load()}catch(err){msg(err.message,true)}};$("create").onclick=()=>openForm();$("refresh").onclick=()=>load().catch(e=>msg(e.message,true));["search","type","active"].forEach(id=>$(id).oninput=render);$("actor").onchange=()=>{sessionStorage.setItem("mes_dev_actor",$("actor").value);load().catch(e=>msg(e.message,true))};init().catch(e=>msg(e.message,true));
{const nav=document.querySelector("header .row"),link=document.createElement("a");link.className="btn";link.href="/settings/models";link.textContent="模型设置";nav.insertBefore(link,nav.querySelector(".identity"));}
</script></body></html>
