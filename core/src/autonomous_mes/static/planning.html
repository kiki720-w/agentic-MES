<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agentic MES · APS 排产中心</title>
  <style>
    :root{--bg:#07131c;--panel:#0d1d29;--panel2:#102632;--line:#203a48;--text:#e4eef1;--muted:#8fa6af;--cyan:#57dbc9;--blue:#63aef7;--amber:#ffd27d;--red:#ff99a4;--green:#79e2bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#173747 0,transparent 38%),var(--bg);color:var(--text);font:13px/1.5 Inter,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1500px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.brand small,.muted{color:var(--muted)}h1{margin:2px 0 0;font-size:25px}.actions,.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{border:1px solid #2b6670;border-radius:8px;padding:8px 12px;background:#123541;color:var(--text);cursor:pointer;text-decoration:none}.btn.primary{background:var(--cyan);color:#062019;border-color:var(--cyan);font-weight:800}.btn.danger{border-color:#713942;color:var(--red)}.btn:disabled{opacity:.38;cursor:not-allowed}.identity{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0a1923}.identity select{background:transparent;color:var(--text);border:0}.notice{min-height:20px;color:var(--amber);margin-bottom:10px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.kpi,.panel{border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:0 14px 38px #02080d55}.kpi{padding:14px}.kpi span{display:block;color:var(--muted);font-size:10px}.kpi strong{font-size:23px}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px}.panel{overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:14px}.body{padding:15px}.form{display:grid;gap:10px}.form label{color:var(--muted);font-size:11px}.form input,.form select,.form textarea,.toolbar input{width:100%;margin-top:4px;padding:9px;border:1px solid #294855;border-radius:8px;background:#071722;color:var(--text)}.form textarea{min-height:78px;font:11px/1.5 "Cascadia Code",monospace}.check{display:flex;gap:8px;align-items:center}.check input{width:auto;margin:0}.resource-list,.plan-list{display:grid;gap:8px}.resource-list{max-height:340px;overflow:auto}.resource{padding:10px;border:1px solid var(--line);border-radius:9px;background:#091923}.resource strong,.resource small{display:block}.badge{display:inline-flex;width:max-content;padding:3px 8px;border-radius:99px;background:#1a3040;color:#c4d8de;font-size:10px;font-weight:800}.badge.PUBLISHED,.badge.APPROVED,.badge.ON_TIME{background:#123b35;color:var(--green)}.badge.DRAFT,.badge.PENDING_APPROVAL{background:#47391e;color:var(--amber)}.badge.WITHDRAWN,.badge.LATE{background:#4a222b;color:var(--red)}.plan-head{display:flex;justify-content:space-between;gap:10px}.plan-head h2{margin:0;font-size:18px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:13px 0}.metric{padding:9px;border-radius:8px;background:#071722}.metric span{display:block;color:var(--muted);font-size:9px}.metric strong{font-size:16px}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:#0a1923;color:var(--muted)}.tabs button.active{color:var(--text);border-color:var(--cyan)}.table-wrap{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #172d39;text-align:left}th{position:sticky;top:0;background:#0d202c;color:var(--muted);font-size:10px}td{font-size:11px}.empty{padding:36px;text-align:center;color:var(--muted)}.history-card{padding:12px;border:1px solid var(--line);border-radius:9px;background:#091923}.history-card p{margin:4px 0;color:var(--muted)}.source-note{padding:10px 12px;border-left:3px solid var(--blue);background:#0a1c28;color:var(--muted);margin-bottom:12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.toolbar input{flex:1;margin:0;min-width:180px}.toolbar .muted,.toolbar .btn{white-space:nowrap}.load-cell{min-width:118px}.load-bar{height:5px;margin-top:5px;border-radius:9px;background:#17303c;overflow:hidden}.load-bar i{display:block;height:100%;background:var(--cyan)}details.editor{border-top:1px solid var(--line)}details.editor summary{padding:11px 15px;cursor:pointer;color:var(--cyan)}dialog{width:min(520px,calc(100% - 32px));border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--text);box-shadow:0 25px 80px #000a}dialog::backdrop{background:#02080dbb}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){.grid{grid-template-columns:1fr}}@media(max-width:650px){.shell{padding:13px}.topbar{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main class="shell">
  <header class="topbar"><div class="brand"><small>AGENTIC MES · UNIFIED APS</small><h1>有限产能排产中心</h1></div><div class="actions"><a class="btn" href="/">返回 MES</a><div class="identity"><select id="actor"></select></div><button class="btn" id="refresh">刷新</button></div></header>
  <div class="notice" id="notice"></div>
  <section class="kpis"><div class="kpi"><span>候选工单</span><strong id="kOrders">—</strong></div><div class="kpi"><span>已排工单</span><strong id="kScheduled">—</strong></div><div class="kpi"><span>排产条目</span><strong id="kAssignments">—</strong></div><div class="kpi"><span>未排缺口</span><strong id="kShortages">—</strong></div><div class="kpi"><span>能力利用率</span><strong id="kUtilization">—</strong></div></section>
  <div class="grid"><aside style="display:grid;gap:14px;align-content:start">
    <section class="panel"><div class="panel-head"><h2>生成滚动计划</h2><span class="badge">确定性 APS</span></div><form class="body form" id="generateForm"><label>车间<input id="workshop" value="WS-MACH-01" required></label><label>开始日期<input id="startDate" type="date" required></label><label>工作日窗口<select id="horizon"><option value="6">6 个工作日</option><option value="10">10 个工作日</option><option value="15">15 个工作日</option><option value="20">20 个工作日</option></select></label><label>默认单件标准工时（分钟）<input id="rate" type="number" min="0.1" step="0.1" value="30" required></label><label>产品/工序工时覆盖（JSON）<textarea id="rates" placeholder='{"TURN": 12, "PR-SHAFT-A:GRIND": 18}'>{}</textarea></label><label class="check"><input id="overtime" type="checkbox">启用加班能力</label><button class="btn primary" id="generate" type="submit">生成排产草稿</button></form></section>
    <section class="panel"><div class="panel-head"><h2>人员与工作单元能力</h2><span class="badge" id="resourceCount">0</span></div><details class="editor"><summary>登记新的能力资源</summary><form class="body form" id="resourceForm"><label>资源编号<input id="resourceCode" placeholder="OPERATOR-001" required></label><label>名称<input id="resourceName" placeholder="操作员或工作单元" required></label><div class="row"><label style="flex:1">类型<select id="resourceType"><option>PERSON</option><option>CELL</option></select></label><label style="flex:1">工作中心<input id="workCenter" value="WC-LATHE-01" required></label></div><div class="row"><label style="flex:1">正常能力<input id="normalCapacity" type="number" value="480" min="1" required></label><label style="flex:1">加班上限<input id="overtimeCapacity" type="number" value="600" min="1" required></label></div><label>能力代码（逗号分隔）<input id="capabilities" value="TURN" placeholder="TURN,GRIND"></label><button class="btn" id="addResource" type="submit">登记排产资源</button></form></details><div class="body resource-list" id="resources"></div></section>
  </aside><section style="display:grid;gap:14px;align-content:start">
    <section class="panel"><div class="body source-note">统一读取 MES 工单、冻结工艺路线和实时设备状态。人员能力优先；没有人员档案时，可使用同工作中心的健康设备作为有限产能回退。AI 不参与排产计算或审批。</div><div class="body" id="latest"><div class="empty">尚未生成排产计划</div></div></section>
    <section class="panel"><div class="panel-head"><h2>计划版本与审计</h2><span class="muted">草稿 → 双人审批 → 发布 → 可撤回</span></div><div class="body plan-list" id="history"></div></section>
  </section></div>
</main><dialog id="moveDialog"><div class="dialog-head"><strong>调整排产条目</strong><button class="btn" type="button" onclick="closeMove()">关闭</button></div><form class="body form" id="moveForm"><div class="muted" id="moveSummary"></div><label>目标资源<select id="moveResource" required></select></label><label>生产日期<input id="moveDate" type="date" required></label><label>调整原因<textarea id="moveReason" required maxlength="512" placeholder="记录负荷均衡、人员请假、设备变化等原因"></textarea></label><button class="btn primary" type="submit">保存调整</button></form></dialog>
<script>
const $=id=>document.getElementById(id),state={identity:null,plans:[],resources:[],tab:"calendar",page:1,query:"",moving:null};
function actorId(){return sessionStorage.getItem("mes_dev_actor")||"demo-planner"}function can(role){return state.identity?.roles?.includes(role)}
async function api(path,options={}){const headers=new Headers(options.headers||{});headers.set("X-Dev-Actor",actorId());const response=await fetch(path,{...options,headers});if(!response.ok){const body=await response.json().catch(()=>({detail:response.statusText}));throw new Error(body.detail||body.message||response.statusText)}return response.json()}
function message(text,error=false){$("notice").textContent=text;$("notice").style.color=error?"var(--red)":"var(--amber)"}
async function initialize(){const auth=await fetch("/api/v1/system/auth-config").then(r=>r.json());$("actor").replaceChildren(...auth.devProfiles.map(profile=>{const option=document.createElement("option");option.value=profile.subjectId;option.textContent=profile.displayName;option.selected=profile.subjectId===actorId();return option}));$("startDate").value=new Date().toISOString().slice(0,10);await load()}
async function load(){state.identity=await api("/api/v1/identity/me");const workshop=encodeURIComponent($("workshop").value);[state.resources,state.plans]=await Promise.all([api(`/api/v1/planning/resources?workshopId=${workshop}`),api(`/api/v1/planning/plans?workshopId=${workshop}`)]);render()}
function render(){const plan=state.plans[0],metrics=plan?.metrics||{};$("kOrders").textContent=metrics.candidateOrderCount??0;$("kScheduled").textContent=metrics.scheduledOrderCount??0;$("kAssignments").textContent=metrics.assignmentCount??0;$("kShortages").textContent=metrics.shortageCount??0;$("kUtilization").textContent=`${metrics.capacityUtilizationPercent??0}%`;$("generate").disabled=!can("PLANNER");$("addResource").disabled=!can("PLANNER");$("resourceCount").textContent=state.resources.length;const visibleResources=state.resources.slice(0,50);$("resources").innerHTML=state.resources.length?visibleResources.map(r=>`<article class="resource"><div class="row"><strong>${escapeHtml(r.code)} · ${escapeHtml(r.name)}</strong><span class="badge">${r.resourceType}</span></div><small>${escapeHtml(r.workCenterId)} · 正常 ${r.dailyCapacityMinutes} / 加班 ${r.overtimeCapacityMinutes} 分钟</small><small>能力：${r.capabilityCodes.join("、")||"同工作中心全部工序"}</small></article>`).join("")+(state.resources.length>50?`<small class="muted">仅显示前 50 / ${state.resources.length} 项</small>`:""):'<div class="empty">尚无人员能力档案，将使用健康设备回退</div>';renderLatest(plan);$("history").innerHTML=state.plans.length?state.plans.map(renderHistory).join(""):'<div class="empty">暂无计划版本</div>'}
function renderLatest(plan){if(!plan){$("latest").innerHTML='<div class="empty">尚未生成排产计划</div>';return}const m=plan.metrics;const action=planActions(plan);let content=capacityBoard(plan.assignments);if(state.tab==="assignments")content=assignmentTable(plan.assignments,plan);if(state.tab==="shortages")content=shortageTable(plan.shortages);$("latest").innerHTML=`<div class="plan-head"><div><span class="badge ${plan.status}">${plan.status}</span><h2>${escapeHtml(plan.planNumber)}</h2><span class="muted">${plan.horizonStart} 起 · ${plan.horizonDays} 个工作日 · 创建 ${escapeHtml(plan.createdBy)}</span></div><div class="actions">${action}</div></div><div class="metrics"><div class="metric"><span>候选工单</span><strong>${m.candidateOrderCount}</strong></div><div class="metric"><span>已排工单</span><strong>${m.scheduledOrderCount}</strong></div><div class="metric"><span>延期工单</span><strong>${m.lateOrderCount}</strong></div><div class="metric"><span>未排缺口</span><strong>${m.shortageCount}</strong></div><div class="metric"><span>计划工时</span><strong>${m.plannedWorkMinutes}</strong></div></div><div class="tabs"><button class="${state.tab==="calendar"?"active":""}" onclick="setTab('calendar')">产能日历</button><button class="${state.tab==="assignments"?"active":""}" onclick="setTab('assignments')">排产明细 ${plan.assignments.length}</button><button class="${state.tab==="shortages"?"active":""}" onclick="setTab('shortages')">能力缺口 ${plan.shortages.length}</button></div>${content}`;bindActions(plan)}
function planActions(p){if(p.status==="DRAFT")return `<button class="btn primary" data-action="submit" ${!can("PLANNER")||!p.assignments.length?"disabled":""}>提交审批</button>`;if(p.status==="PENDING_APPROVAL")return `<button class="btn primary" data-action="approve" ${!can("SUPERVISOR")||[p.createdBy,p.submittedBy].includes(state.identity?.subjectId)?"disabled":""}>主管批准</button>`;if(p.status==="APPROVED")return `<button class="btn primary" data-action="publish" ${!can("SUPERVISOR")?"disabled":""}>发布执行</button>`;if(p.status==="PUBLISHED")return `<button class="btn danger" data-action="withdraw" ${!can("SUPERVISOR")?"disabled":""}>撤回计划</button>`;return ""}
function bindActions(plan){const button=$("latest").querySelector("[data-action]");if(!button)return;button.onclick=async()=>{try{const action=button.dataset.action;let body={expectedRecordVersion:plan.recordVersion};if(action==="approve"||action==="withdraw"){const reason=prompt(action==="approve"?"审批说明":"撤回原因");if(!reason)return;body.reason=reason}await api(`/api/v1/planning/plans/${plan.planId}/${action}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});message("计划状态已更新");await load()}catch(error){message(error.message,true)}}}
function filteredPage(rows){const query=state.query.trim().toLowerCase();const filtered=query?rows.filter(row=>Object.values(row).some(value=>String(value??"").toLowerCase().includes(query))):rows;const pages=Math.max(1,Math.ceil(filtered.length/50));state.page=Math.min(state.page,pages);return{rows:filtered.slice((state.page-1)*50,state.page*50),total:filtered.length,pages}}
function listToolbar(total,pages){return `<div class="toolbar"><input id="planSearch" value="${escapeHtml(state.query)}" placeholder="搜索工单、工序、资源或原因" onkeydown="if(event.key==='Enter'){event.preventDefault();applySearch(this.value)}"><button class="btn" onclick="applySearch($('planSearch').value)">搜索</button><span class="muted">${total} 项 · ${state.page}/${pages} 页</span><button class="btn" ${state.page<=1?"disabled":""} onclick="pageBy(-1)">上一页</button><button class="btn" ${state.page>=pages?"disabled":""} onclick="pageBy(1)">下一页</button></div>`}
function assignmentTable(rows,plan){if(!rows.length)return '<div class="empty">没有可排任务，请查看能力缺口</div>';const page=filteredPage(rows);return `${listToolbar(page.total,page.pages)}<div class="table-wrap"><table><thead><tr><th>日期</th><th>工单</th><th>工序</th><th>资源</th><th>工作中心</th><th>数量</th><th>分钟</th><th>交付</th>${plan.status==="DRAFT"&&can("PLANNER")?"<th>操作</th>":""}</tr></thead><tbody>${page.rows.map(a=>`<tr><td>${a.productionDate}</td><td>${escapeHtml(a.workOrderCode)}</td><td>${a.operationSequence} · ${escapeHtml(a.operationName)}</td><td>${escapeHtml(a.resourceName)}<br><small>${a.resourceType}</small></td><td>${escapeHtml(a.workCenterId)}</td><td>${a.plannedQuantity}</td><td>${a.plannedWorkMinutes}</td><td><span class="badge ${a.deliveryStatus}">${a.deliveryStatus}</span></td>${plan.status==="DRAFT"&&can("PLANNER")?`<td><button class="btn" onclick="openMove('${a.assignmentId}')">调整</button></td>`:""}</tr>`).join("")}</tbody></table></div>`}
function shortageTable(rows){if(!rows.length)return '<div class="empty">当前计划没有能力缺口</div>';const page=filteredPage(rows);return `${listToolbar(page.total,page.pages)}<div class="table-wrap"><table><thead><tr><th>工单</th><th>工序</th><th>工作中心</th><th>剩余数量</th><th>剩余分钟</th><th>原因</th></tr></thead><tbody>${page.rows.map(a=>`<tr><td>${escapeHtml(a.workOrderCode)}</td><td>${a.operationSequence||"—"} · ${escapeHtml(a.operationName)}</td><td>${escapeHtml(a.workCenterId)||"—"}</td><td>${a.remainingQuantity}</td><td>${a.remainingWorkMinutes}</td><td>${escapeHtml(a.reason)}</td></tr>`).join("")}</tbody></table></div>`}
function capacityBoard(rows){if(!rows.length)return '<div class="empty">暂无可显示的产能安排</div>';const days=[...new Set(rows.map(a=>a.productionDate))].sort(),resources=[...new Map(rows.map(a=>[a.resourceId,{id:a.resourceId,code:a.resourceCode,name:a.resourceName}])).values()];const capacities=new Map(state.resources.map(r=>[r.resourceId,r]));return `<div class="table-wrap"><table><thead><tr><th>资源</th>${days.map(day=>`<th>${day}</th>`).join("")}</tr></thead><tbody>${resources.map(resource=>`<tr><td><strong>${escapeHtml(resource.code)}</strong><br><small>${escapeHtml(resource.name)}</small></td>${days.map(day=>{const used=rows.filter(a=>a.resourceId===resource.id&&a.productionDate===day).reduce((sum,a)=>sum+Number(a.plannedWorkMinutes),0),profile=capacities.get(resource.id),limit=profile?(state.plans[0].useOvertime?profile.overtimeCapacityMinutes:profile.dailyCapacityMinutes):480,percent=Math.min(100,Math.round(used/limit*100));return `<td class="load-cell">${used?`${used} / ${limit} 分钟<div class="load-bar"><i style="width:${percent}%"></i></div><small class="muted">${percent}% · ${rows.filter(a=>a.resourceId===resource.id&&a.productionDate===day).length} 项</small>`:"—"}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`}
function renderHistory(p){return `<article class="history-card"><div class="row"><strong>${escapeHtml(p.planNumber)}</strong><span class="badge ${p.status}">${p.status}</span></div><p>${p.horizonStart} · ${p.metrics.assignmentCount} 条安排 · ${p.metrics.shortageCount} 项缺口 · v${p.recordVersion}</p><small class="muted">创建 ${escapeHtml(p.createdBy)}${p.approvedBy?` · 审批 ${escapeHtml(p.approvedBy)}`:""}${p.publishedBy?` · 发布 ${escapeHtml(p.publishedBy)}`:""}</small></article>`}
function setTab(name){state.tab=name;state.page=1;state.query="";renderLatest(state.plans[0])}function applySearch(value){state.query=value;state.page=1;renderLatest(state.plans[0])}function pageBy(delta){state.page+=delta;renderLatest(state.plans[0])}
function openMove(assignmentId){const plan=state.plans[0],assignment=plan.assignments.find(item=>item.assignmentId===assignmentId);if(!assignment)return;state.moving=assignment;$("moveSummary").textContent=`${assignment.workOrderCode} · ${assignment.operationSequence} ${assignment.operationName} · ${assignment.plannedWorkMinutes} 分钟`;const candidates=state.resources.filter(r=>r.active&&r.workCenterId===assignment.workCenterId&&(!r.capabilityCodes.length||r.capabilityCodes.includes("*")||r.capabilityCodes.includes(assignment.operationCode)));if(!candidates.some(r=>r.resourceId===assignment.resourceId))candidates.unshift({resourceId:assignment.resourceId,code:assignment.resourceCode,name:assignment.resourceName});$("moveResource").replaceChildren(...candidates.map(resource=>{const option=document.createElement("option");option.value=resource.resourceId;option.textContent=`${resource.code} · ${resource.name}`;option.selected=resource.resourceId===assignment.resourceId;return option}));$("moveDate").value=assignment.productionDate;$("moveReason").value="";$("moveDialog").showModal()}
function closeMove(){state.moving=null;$("moveDialog").close()}function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("actor").onchange=()=>{sessionStorage.setItem("mes_dev_actor",$("actor").value);load().catch(e=>message(e.message,true))};$("refresh").onclick=()=>load().catch(e=>message(e.message,true));$("workshop").onchange=()=>load().catch(e=>message(e.message,true));
$("generateForm").onsubmit=async event=>{event.preventDefault();try{const operationRates=JSON.parse($("rates").value||"{}");await api("/api/v1/planning/plans/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({workshopId:$("workshop").value,horizonStart:$("startDate").value,horizonDays:Number($("horizon").value),useOvertime:$("overtime").checked,defaultMinutesPerUnit:Number($("rate").value),operationRates})});message("新的有限产能排产草稿已生成");await load()}catch(error){message(error.message,true)}};
$("resourceForm").onsubmit=async event=>{event.preventDefault();try{await api("/api/v1/planning/resources",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:$("resourceCode").value,name:$("resourceName").value,resourceType:$("resourceType").value,workshopId:$("workshop").value,workCenterId:$("workCenter").value,dailyCapacityMinutes:Number($("normalCapacity").value),overtimeCapacityMinutes:Number($("overtimeCapacity").value),capabilityCodes:$("capabilities").value.split(",").map(x=>x.trim()).filter(Boolean)})});message("排产资源已登记");$("resourceCode").value="";$("resourceName").value="";await load()}catch(error){message(error.message,true)}};
$("moveForm").onsubmit=async event=>{event.preventDefault();const plan=state.plans[0],assignment=state.moving;if(!plan||!assignment)return;try{await api(`/api/v1/planning/plans/${plan.planId}/assignments/${assignment.assignmentId}/move`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({expectedRecordVersion:plan.recordVersion,targetResourceId:$("moveResource").value,productionDate:$("moveDate").value,reason:$("moveReason").value})});closeMove();message("排产条目已调整并写入事件审计");await load()}catch(error){message(error.message,true)}};
initialize().catch(error=>message(error.message,true));
</script></body></html>
