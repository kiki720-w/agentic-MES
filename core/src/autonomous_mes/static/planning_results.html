<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排产结果 · Agentic Manufacturing</title><style>
:root{--bg:#07131c;--panel:#0c1c27;--line:#203b48;--text:#e7f1f3;--muted:#8fa6af;--cyan:#58dec9;--amber:#ffd27d;--red:#ff98a4;--green:#79e2bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#173f50 0,transparent 38%),var(--bg);color:var(--text);font:13px/1.5 Inter,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}.shell{max-width:1800px;margin:auto;padding:22px}.top,.row,.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:15px}h1{margin:2px 0;font-size:25px}.muted{color:var(--muted)}.btn{border:1px solid #2b5b68;border-radius:8px;background:#102c38;color:var(--text);padding:8px 11px;text-decoration:none;cursor:pointer}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#05221b;font-weight:800}.btn.danger{color:var(--red);border-color:#713a44}.btn:disabled{opacity:.4;cursor:not-allowed}.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#102631,var(--panel));overflow:hidden}.planbar{padding:13px 15px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line)}select,input{background:#071722;color:var(--text);border:1px solid #294b58;border-radius:8px;padding:8px}.identity{display:flex;gap:8px;flex-wrap:wrap;padding:13px 15px;border-bottom:1px solid var(--line)}.person{padding:8px 10px;border:1px solid var(--line);border-radius:9px;min-width:160px}.person span,.person strong{display:block}.person span{font-size:9px;color:var(--muted)}.badge{display:inline-flex;padding:3px 8px;border-radius:99px;background:#173746;font-size:10px;font-weight:800}.badge.PUBLISHED,.badge.APPROVED,.badge.ON_TIME{background:#123c35;color:var(--green)}.badge.DRAFT,.badge.PENDING_APPROVAL{background:#48391d;color:var(--amber)}.badge.LATE,.badge.WITHDRAWN{background:#48232a;color:var(--red)}.badge.agent{background:#183b4b;color:#8edcf1}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:13px 15px}.kpi{padding:10px;background:#071722;border-radius:9px}.kpi span,.kpi strong{display:block}.kpi span{font-size:9px;color:var(--muted)}.kpi strong{font-size:19px}.tabs{display:flex;gap:5px;padding:0 15px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:11px;cursor:pointer}.tabs button.active{color:var(--text);border-color:var(--cyan)}.toolbar{padding:10px 15px}.toolbar input{min-width:270px;flex:1}.table-wrap{overflow:auto;max-height:calc(100vh - 385px);min-height:280px}table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}th,td{padding:10px 12px;border-bottom:1px solid #17303b;text-align:left}th{position:sticky;top:0;background:#0d202b;color:var(--muted);font-size:10px;z-index:2}th:first-child,td:first-child{position:sticky;left:0;background:#0d202b;z-index:1}th:first-child{z-index:3}.empty{text-align:center;padding:50px;color:var(--muted)}.notice{min-height:22px;color:var(--amber)}@media(max-width:900px){.shell{padding:11px}.kpis{grid-template-columns:repeat(3,1fr)}.table-wrap{max-height:65vh}}@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><header class="top"><div><div class="muted">FINITE CAPACITY SCHEDULE EVIDENCE</div><h1>全宽排产结果</h1><div class="muted">版本、排产执行者、输入来源、工时依据与缺口在同一处核对</div></div><div class="row"><a class="btn" href="/">控制塔</a><a class="btn" href="/workspace">Agent 工作台</a><a class="btn" href="/planning">排产中心</a><a class="btn" href="/capacity">产能管理</a><select id="actor"></select><button class="btn" id="refresh">刷新</button></div></header><div class="notice" id="notice"></div><section class="panel"><div class="planbar"><div class="row"><select id="plan"></select><span class="badge" id="status">—</span><span class="muted" id="source">—</span></div><div class="row" id="actions"></div></div><div class="identity" id="identityChain"></div><div class="kpis" id="kpis"></div><div class="tabs"><button class="active" data-tab="assignments">排产明细</button><button data-tab="loads">资源负荷</button><button data-tab="shortages">能力缺口</button><button data-tab="evidence">计算依据</button></div><div class="toolbar"><input id="search" placeholder="搜索工单、工序、资源、日期或原因"><span class="muted" id="pageInfo"></span><button class="btn" id="prev">上一页</button><button class="btn" id="next">下一页</button></div><div id="content"></div></section></main><script>
const $=id=>document.getElementById(id),state={plans:[],current:null,identity:null,tab:"assignments",page:1,q:""};function actorId(){return sessionStorage.getItem("mes_dev_actor")||"demo-planner"}function can(r){return state.identity?.roles?.includes(r)}async function api(path,options={}){const h=new Headers(options.headers||{});h.set("X-Dev-Actor",actorId());const r=await fetch(path,{...options,headers:h});if(!r.ok){const b=await r.json().catch(()=>({detail:r.statusText}));throw Error(b.detail||r.statusText)}return r.json()}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function msg(t,e=false){$("notice").textContent=t;$("notice").style.color=e?"var(--red)":"var(--amber)"}function actor(v){if(!v)return "—";if(v==="scheduling-agent-l3-v1")return "虚拟员工「衡策」 · L3";return v}
async function init(){const auth=await fetch("/api/v1/system/auth-config").then(r=>r.json());$("actor").replaceChildren(...auth.devProfiles.map(p=>{const o=document.createElement("option");o.value=p.subjectId;o.textContent=p.displayName;o.selected=p.subjectId===actorId();return o}));await load()}async function load(){[state.identity,state.plans]=await Promise.all([api("/api/v1/identity/me"),api("/api/v1/planning/plans?workshopId=WS-MACH-01&limit=100")]);const selected=state.current?.planId;state.current=state.plans.find(p=>p.planId===selected)||state.plans[0]||null;$("plan").replaceChildren(...state.plans.map(p=>{const o=document.createElement("option");o.value=p.planId;o.textContent=`${p.planNumber} · ${p.status} · ${new Date(p.createdAt).toLocaleString()}`;o.selected=p.planId===state.current?.planId;return o}));render()}
function render(){const p=state.current;if(!p){$("content").innerHTML='<div class="empty">尚无排产结果。可从 Agent 工作台导入 Excel，或在排产中心生成计划。</div>';$("identityChain").innerHTML="";$("kpis").innerHTML="";return}$("status").textContent=p.status;$("status").className=`badge ${p.status}`;const src=p.generationParameters.inputSource||{};$("source").textContent=src.type==="EXTERNAL_SCHEDULING_SNAPSHOT"?`输入：${src.sourceSystem} · ${src.sourceRevision}`:"输入：内置模拟投影";$("identityChain").innerHTML=[["排产创建者",p.createdBy],["提交者",p.submittedBy],["审批者",p.approvedBy],["发布者",p.publishedBy]].map(([l,v],i)=>`<div class="person"><span>${l}</span><strong>${esc(actor(v))}</strong>${i===0&&v==="scheduling-agent-l3-v1"?'<em class="badge agent">VIRTUAL EMPLOYEE</em>':""}</div>`).join("");const m=p.metrics;$("kpis").innerHTML=[["候选工单",m.candidateOrderCount],["已排工单",m.scheduledOrderCount],["排产条目",m.assignmentCount],["延期工单",m.lateOrderCount],["能力缺口",m.shortageCount],["能力利用率",`${m.capacityUtilizationPercent}%`]].map(x=>`<div class="kpi"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");renderActions(p);renderTable()}
function renderActions(p){let h="";if(p.status==="DRAFT")h=`<button class="btn primary" data-a="submit" ${!can("PLANNER")||!p.assignments.length?"disabled title='需要计划员身份且方案包含排产条目'":""}>提交审批</button>`;if(p.status==="PENDING_APPROVAL")h=`<button class="btn primary" data-a="approve" ${!can("SUPERVISOR")||[p.createdBy,p.submittedBy].includes(state.identity?.subjectId)?"disabled title='需要独立主管身份；创建者/提交者不可自批'":""}>主管批准</button>`;if(p.status==="APPROVED")h=`<button class="btn primary" data-a="publish" ${!can("SUPERVISOR")?"disabled title='需要主管身份'":""}>发布计划</button>`;if(p.status==="PUBLISHED")h=`<button class="btn danger" data-a="withdraw" ${!can("SUPERVISOR")?"disabled title='需要主管身份'":""}>撤回</button>`;$("actions").innerHTML=h;const b=$("actions").querySelector("button");if(b)b.onclick=()=>transition(b.dataset.a,p)}async function transition(action,p){try{let body={expectedRecordVersion:p.recordVersion};if(["approve","withdraw"].includes(action)){const reason=prompt(action==="approve"?"请输入审批说明":"请输入撤回原因");if(!reason)return;body.reason=reason}await api(`/api/v1/planning/plans/${p.planId}/${action}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});msg("计划状态已更新");await load()}catch(e){msg(e.message,true)}}
function rows(){const p=state.current;if(state.tab==="shortages")return p.shortages;if(state.tab==="loads"){const map=new Map;for(const a of p.assignments){const k=`${a.resourceId}|${a.productionDate}`,x=map.get(k)||{resourceCode:a.resourceCode,resourceName:a.resourceName,resourceType:a.resourceType,productionDate:a.productionDate,minutes:0,items:0};x.minutes+=Number(a.plannedWorkMinutes);x.items++;map.set(k,x)}return [...map.values()]}return p.assignments}function renderTable(){const p=state.current;if(state.tab==="evidence"){const gp=p.generationParameters;$("pageInfo").textContent="";$("content").innerHTML=`<div style="padding:18px"><h3>排产计算依据</h3><p>需求公式：${esc(gp.workDemandFormula||"剩余数量 × 单件工时")}</p><p>算法：${esc(gp.algorithm)}；工作日历：${esc(gp.workingCalendar)}；加班：${p.useOvertime?"启用":"未启用"}</p><p>工序优先使用输入快照中的单件工时与准备工时；缺失时才使用工序覆盖或默认值 ${gp.defaultMinutesPerUnit} 分钟。</p><p class="muted">输入指纹：${esc(gp.inputFingerprint||"人工生成，无 Agent 指纹")}</p></div>`;return}const q=state.q.toLowerCase(),all=rows().filter(x=>!q||Object.values(x).join(" ").toLowerCase().includes(q)),pages=Math.max(1,Math.ceil(all.length/100));state.page=Math.min(state.page,pages);const page=all.slice((state.page-1)*100,state.page*100);$("pageInfo").textContent=`${all.length} 项 · ${state.page}/${pages} 页`;$("prev").disabled=state.page<=1;$("next").disabled=state.page>=pages;if(!page.length){$("content").innerHTML='<div class="empty">没有匹配记录</div>';return}if(state.tab==="assignments")$("content").innerHTML=table(["工单","工序","资源 / 类型","日期","数量","总分钟","单件工时","准备工时","需求来源","交付"],page.map(a=>[a.workOrderCode,`${a.operationSequence} · ${a.operationName}`,`${a.resourceName} · ${a.resourceType}`,a.productionDate,a.plannedQuantity,a.plannedWorkMinutes,a.minutesPerUnit??"默认",a.setupMinutes??0,a.demandSource??"FALLBACK_RATE",`<span class="badge ${a.deliveryStatus}">${a.deliveryStatus}</span>`]));if(state.tab==="shortages")$("content").innerHTML=table(["工单","工序","工作中心","剩余数量","剩余分钟","交期","原因"],page.map(a=>[a.workOrderCode,`${a.operationSequence} · ${a.operationName}`,a.workCenterId,a.remainingQuantity,a.remainingWorkMinutes,a.dueAt,a.reason]));if(state.tab==="loads")$("content").innerHTML=table(["资源","类型","日期","计划分钟","排产项数"],page.map(a=>[`${a.resourceCode} · ${a.resourceName}`,a.resourceType,a.productionDate,Math.round(a.minutes*1000)/1000,a.items]))}function table(head,data){return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${data.map(r=>`<tr>${r.map((x,i)=>`<td>${i===r.length-1&&String(x).startsWith("<span")?x:esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.tab=b.dataset.tab;state.page=1;renderTable()});$("search").oninput=()=>{state.q=$("search").value;state.page=1;renderTable()};$("prev").onclick=()=>{state.page--;renderTable()};$("next").onclick=()=>{state.page++;renderTable()};$("plan").onchange=()=>{state.current=state.plans.find(p=>p.planId===$("plan").value);state.page=1;render()};$("refresh").onclick=()=>load().catch(e=>msg(e.message,true));$("actor").onchange=()=>{sessionStorage.setItem("mes_dev_actor",$("actor").value);load().catch(e=>msg(e.message,true))};init().catch(e=>msg(e.message,true));
</script></body></html>
