<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排产结果 · CAPAXION</title><style>
:root{--bg:#07131c;--panel:#0c1c27;--line:#203b48;--text:#e7f1f3;--muted:#8fa6af;--cyan:#58dec9;--amber:#ffd27d;--red:#ff98a4;--green:#79e2bd;--blue:#6ab3fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#173f50 0,transparent 38%),var(--bg);color:var(--text);font:13px/1.5 Inter,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}.shell{max-width:1850px;margin:auto;padding:22px}.top,.row,.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:15px}h1{margin:2px 0;font-size:25px}.muted{color:var(--muted)}.btn{border:1px solid #2b5b68;border-radius:8px;background:#102c38;color:var(--text);padding:8px 11px;text-decoration:none;cursor:pointer}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#05221b;font-weight:800}.btn.danger{color:var(--red);border-color:#713a44}.btn:disabled{opacity:.4;cursor:not-allowed}.mode{padding:5px 9px;border-radius:99px;background:#14392f;color:var(--green);font-size:10px;font-weight:800}.identity-select{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;background:#091821;padding:4px 8px}.identity-select span{font-size:10px;color:var(--muted)}select,input{background:#071722;color:var(--text);border:1px solid #294b58;border-radius:8px;padding:8px}.identity-select select{border:0;background:transparent;padding:4px}.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#102631,var(--panel));overflow:hidden}.planbar{padding:13px 15px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.identity-chain{display:flex;gap:8px;flex-wrap:wrap;padding:13px 15px;border-bottom:1px solid var(--line)}.person{padding:8px 10px;border:1px solid var(--line);border-radius:9px;min-width:160px}.person span,.person strong{display:block}.person span{font-size:9px;color:var(--muted)}.badge{display:inline-flex;padding:3px 8px;border-radius:99px;background:#173746;font-size:10px;font-weight:800}.badge.PUBLISHED,.badge.APPROVED,.badge.ON_TIME{background:#123c35;color:var(--green)}.badge.DRAFT,.badge.PENDING_APPROVAL{background:#48391d;color:var(--amber)}.badge.LATE,.badge.WITHDRAWN{background:#48232a;color:var(--red)}.badge.agent{background:#183b4b;color:#8edcf1}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:13px 15px}.kpi{padding:10px;background:#071722;border-radius:9px}.kpi span,.kpi strong{display:block}.kpi span{font-size:9px;color:var(--muted)}.kpi strong{font-size:19px}.tabs{display:flex;gap:5px;padding:0 15px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{white-space:nowrap;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:11px;cursor:pointer}.tabs button.active{color:var(--text);border-color:var(--cyan)}.toolbar{padding:10px 15px}.toolbar input{min-width:270px;flex:1}.table-wrap{overflow:auto;max-height:calc(100vh - 405px);min-height:300px}table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}th,td{padding:10px 12px;border-bottom:1px solid #17303b;text-align:left}th{position:sticky;top:0;background:#0d202b;color:var(--muted);font-size:10px;z-index:2}th:first-child,td:first-child{position:sticky;left:0;background:#0d202b;z-index:1}th:first-child{z-index:3}.schedule td{vertical-align:top;white-space:normal;min-width:180px}.schedule td:first-child{min-width:150px}.task{border-left:3px solid var(--cyan);background:#0a2630;border-radius:5px;padding:7px;margin-bottom:6px}.task small{display:block;color:var(--muted)}.loadbar{width:150px;height:6px;background:#17303b;border-radius:8px;overflow:hidden;margin-top:5px}.loadbar i{height:100%;display:block;background:var(--cyan)}.explain{margin:12px 15px;padding:11px;border-left:3px solid var(--blue);background:#0a202a}.empty{text-align:center;padding:50px;color:var(--muted)}.notice{min-height:22px;color:var(--amber)}@media(max-width:950px){.shell{padding:11px}.kpis{grid-template-columns:repeat(3,1fr)}.table-wrap{max-height:65vh}}@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><header class="top"><div><div class="muted">FINITE CAPACITY SCHEDULE EVIDENCE</div><h1>人员排程与计划结果</h1><div class="muted">先看每个人每天做什么，再下钻工单、资源负荷、缺口与计算依据</div></div><div class="row"><span class="mode">CONTROL PLANE</span><a class="btn primary" href="/workspace">Agent 工作台</a><a class="btn" href="/">控制塔</a><a class="btn" href="/planning">排产中心</a><a class="btn" href="/capacity">产能管理</a><div class="identity-select"><span>当前身份</span><select id="actor"></select></div><button class="btn" id="refresh">刷新</button></div></header><div class="notice" id="notice"></div><section class="panel"><div class="planbar"><div class="row"><select id="plan"></select><span class="badge" id="status">—</span><span class="muted" id="source">—</span></div><div class="row" id="actions"></div></div><div class="identity-chain" id="identityChain"></div><div class="kpis" id="kpis"></div><div class="tabs"><button class="active" data-tab="people">人员日排程</button><button data-tab="week">人员周计划</button><button data-tab="assignments">全部工单明细</button><button data-tab="loads">资源负荷</button><button data-tab="shortages">能力缺口</button><button data-tab="evidence">计算依据</button></div><div class="explain" id="explain">人员日排程只显示 PERSON 类型资源；排到工作单元或设备的任务可在“全部工单明细”和“资源负荷”查看。</div><div class="toolbar" id="toolbar"><input id="search" placeholder="搜索人员、工单、工序、资源、日期或原因"><span class="muted" id="pageInfo"></span><button class="btn" id="prev">上一页</button><button class="btn" id="next">下一页</button></div><div id="content"></div></section></main><script>
const $=id=>document.getElementById(id),state={plans:[],current:null,identity:null,resources:[],tab:"people",page:1,q:""};function actorId(){return sessionStorage.getItem("mes_dev_actor")||"demo-planner"}function can(r){return state.identity?.roles?.includes(r)}async function api(path,options={}){const h=new Headers(options.headers||{});h.set("X-Dev-Actor",actorId());const r=await fetch(path,{...options,headers:h});if(!r.ok){const b=await r.json().catch(()=>({detail:r.statusText}));throw Error(b.detail||r.statusText)}return r.json()}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function msg(t,e=false){$("notice").textContent=t;$("notice").style.color=e?"var(--red)":"var(--amber)"}function actor(v){if(!v)return "—";if(v==="scheduling-agent-l3-v1")return "虚拟员工「衡策」 · L3";return v}
async function init(){const auth=await fetch("/api/v1/system/auth-config").then(r=>r.json());$("actor").replaceChildren(...auth.devProfiles.map(p=>{const o=document.createElement("option");o.value=p.subjectId;o.textContent=p.displayName;o.selected=p.subjectId===actorId();return o}));await load()}async function load(){[state.identity,state.plans,state.resources]=await Promise.all([api("/api/v1/identity/me"),api("/api/v1/planning/plans?workshopId=WS-MACH-01&limit=100"),api("/api/v1/planning/resources?workshopId=WS-MACH-01")]);const selected=state.current?.planId;state.current=state.plans.find(p=>p.planId===selected)||state.plans[0]||null;$("plan").replaceChildren(...state.plans.map(p=>{const o=document.createElement("option");o.value=p.planId;o.textContent=`${p.planNumber} · ${p.status} · ${new Date(p.createdAt).toLocaleString()}`;o.selected=p.planId===state.current?.planId;return o}));render()}
function render(){const p=state.current;if(!p){$("content").innerHTML='<div class="empty">尚无排产结果。可从 Agent 工作台导入 Excel，或在排产中心生成演示方案。</div>';$("identityChain").innerHTML="";$("kpis").innerHTML="";return}$("status").textContent=p.status;$("status").className=`badge ${p.status}`;const src=p.generationParameters.inputSource||{};$("source").textContent=src.type==="EXTERNAL_SCHEDULING_SNAPSHOT"?`输入：${src.sourceSystem} · ${src.sourceRevision}`:"输入：演示投影";$("identityChain").innerHTML=[["排产创建者",p.createdBy],["提交者",p.submittedBy],["审批者",p.approvedBy],["发布者",p.publishedBy]].map(([l,v],i)=>`<div class="person"><span>${l}</span><strong>${esc(actor(v))}</strong>${i===0&&v==="scheduling-agent-l3-v1"?'<em class="badge agent">VIRTUAL EMPLOYEE</em>':""}</div>`).join("");const m=p.metrics;$("kpis").innerHTML=[["候选工单",m.candidateOrderCount],["已排工单",m.scheduledOrderCount],["排产条目",m.assignmentCount],["延期工单",m.lateOrderCount],["能力缺口",m.shortageCount],["能力利用率",`${m.capacityUtilizationPercent}%`]].map(x=>`<div class="kpi"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");renderActions(p);renderContent()}
function renderActions(p){let h="";if(p.status==="DRAFT")h=`<button class="btn primary" data-a="submit" ${!can("PLANNER")||!p.assignments.length?"disabled title='需要计划员身份且方案包含排产条目'":""}>提交审批</button>`;if(p.status==="PENDING_APPROVAL")h=`<button class="btn primary" data-a="approve" ${!can("SUPERVISOR")||[p.createdBy,p.submittedBy].includes(state.identity?.subjectId)?"disabled title='需要独立主管身份；创建者/提交者不可自批'":""}>主管批准</button>`;if(p.status==="APPROVED")h=`<button class="btn primary" data-a="publish" ${!can("SUPERVISOR")?"disabled title='需要主管身份'":""}>发布计划</button>`;if(p.status==="PUBLISHED")h=`<button class="btn danger" data-a="withdraw" ${!can("SUPERVISOR")?"disabled title='需要主管身份'":""}>撤回</button>`;$("actions").innerHTML=h;const b=$("actions").querySelector("button");if(b)b.onclick=()=>transition(b.dataset.a,p)}async function transition(action,p){try{let body={expectedRecordVersion:p.recordVersion};if(["approve","withdraw"].includes(action)){const reason=prompt(action==="approve"?"请输入审批说明":"请输入撤回原因");if(!reason)return;body.reason=reason}await api(`/api/v1/planning/plans/${p.planId}/${action}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});msg("计划状态已更新");await load()}catch(e){msg(e.message,true)}}
function resourceCapacity(a){return Number(a.resourceDailyCapacityMinutes||state.resources.find(r=>r.resourceId===a.resourceId)?.dailyCapacityMinutes||480)}function filtered(rows){const q=state.q.toLowerCase();return rows.filter(x=>!q||Object.values(x).join(" ").toLowerCase().includes(q))}function paginate(rows){const all=filtered(rows),pages=Math.max(1,Math.ceil(all.length/100));state.page=Math.min(state.page,pages);$("pageInfo").textContent=`${all.length} 项 · ${state.page}/${pages} 页`;$("prev").disabled=state.page<=1;$("next").disabled=state.page>=pages;return all.slice((state.page-1)*100,state.page*100)}
function renderContent(){const p=state.current;$("toolbar").style.display=state.tab==="week"||state.tab==="evidence"?"none":"flex";if(state.tab==="people")return peopleDaily(p);if(state.tab==="week")return peopleWeek(p);if(state.tab==="assignments")return assignments(p);if(state.tab==="loads")return loads(p);if(state.tab==="shortages")return shortages(p);return evidence(p)}function peopleDaily(p){const people=p.assignments.filter(a=>a.resourceType==="PERSON").sort((a,b)=>a.resourceName.localeCompare(b.resourceName)||a.productionDate.localeCompare(b.productionDate));$("explain").innerHTML=people.length?`共 <b>${new Set(people.map(a=>a.resourceId)).size}</b> 位人员获得排产任务。每行明确到人员、日期、工单和工序。`:`当前方案没有 PERSON 类型任务；${p.assignments.length} 项任务均排给工作单元或设备。请在<a href="/capacity">产能管理</a>为相应工作中心登记人员与能力工序后重新排产。`;const rows=paginate(people);$("content").innerHTML=rows.length?table(["人员","日期","工单","工序","工作中心","计划数量","计划分钟","当日负荷"],rows.map(a=>{const day=people.filter(x=>x.resourceId===a.resourceId&&x.productionDate===a.productionDate).reduce((s,x)=>s+Number(x.plannedWorkMinutes),0),cap=resourceCapacity(a),pct=Math.round(day/cap*100);return[`${a.resourceName} · ${a.resourceCode}`,a.productionDate,a.workOrderCode,`${a.operationSequence} · ${a.operationName}`,a.workCenterId,a.plannedQuantity,a.plannedWorkMinutes,`${day}/${cap} 分钟 · ${pct}%`]})):'<div class="empty">没有人员排程。工作单元与设备任务仍保留在全部明细中。</div>'}
function planWorkdays(start,count=6){const days=[],cursor=new Date(`${start}T12:00:00`);while(days.length<count){if(cursor.getDay()!==0){const y=cursor.getFullYear(),m=String(cursor.getMonth()+1).padStart(2,"0"),d=String(cursor.getDate()).padStart(2,"0");days.push(`${y}-${m}-${d}`)}cursor.setDate(cursor.getDate()+1)}return days}function dayLabel(value){const names=["周日","周一","周二","周三","周四","周五","周六"],day=new Date(`${value}T12:00:00`);return `${value.slice(5)} · ${names[day.getDay()]}`}
function peopleWeek(p){const all=p.assignments.filter(a=>a.resourceType==="PERSON"),days=planWorkdays(p.horizonStart,6),people=[...new Map(all.map(a=>[a.resourceId,{id:a.resourceId,name:a.resourceName,code:a.resourceCode}])).values()];$("explain").textContent=`本周固定显示 ${days[0]} 至 ${days.at(-1)} 的六个工作日（跳过周日），没有任务的日期也保留；使用表格底部滑动条左右查看。`;if(!people.length){$("content").innerHTML='<div class="empty">当前方案没有人员任务。请补充人员能力后重新排产。</div>';return}$("content").innerHTML=`<div class="table-wrap" tabindex="0" aria-label="六工作日人员周计划，可通过底部滑动条左右滚动"><table class="schedule"><thead><tr><th>人员</th>${days.map(d=>`<th>${dayLabel(d)}</th>`).join("")}</tr></thead><tbody>${people.map(person=>`<tr><td><strong>${esc(person.name)}</strong><small class="muted" style="display:block">${esc(person.code)}</small></td>${days.map(day=>{const tasks=all.filter(a=>a.resourceId===person.id&&a.productionDate===day),used=tasks.reduce((s,a)=>s+Number(a.plannedWorkMinutes),0),cap=tasks[0]?resourceCapacity(tasks[0]):480;return `<td>${tasks.map(a=>`<div class="task"><strong>${esc(a.workOrderCode)}</strong><small>${a.operationSequence} · ${esc(a.operationName)}</small><small>${a.plannedQuantity} 件 · ${a.plannedWorkMinutes} 分钟</small></div>`).join("")||'<span class="muted">—</span>'}${tasks.length?`<small class="muted">合计 ${used}/${cap} 分钟</small>`:""}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`}
function assignments(p){$("explain").textContent="全部工单明细包含人员、工作单元和设备。资源列中的名称就是具体执行人员或产能单元。";const rows=paginate(p.assignments);$("content").innerHTML=rows.length?table(["工单","工序","资源名称","资源类型","日期","数量","总分钟","单件工时","准备工时","需求来源","交付"],rows.map(a=>[a.workOrderCode,`${a.operationSequence} · ${a.operationName}`,`${a.resourceName} · ${a.resourceCode}`,a.resourceType,a.productionDate,a.plannedQuantity,a.plannedWorkMinutes,a.minutesPerUnit??"默认",a.setupMinutes??0,a.demandSource??"FALLBACK_RATE",a.deliveryStatus])):'<div class="empty">没有排产明细</div>'}
function loads(p){const map=new Map;for(const a of p.assignments){const k=`${a.resourceId}|${a.productionDate}`,x=map.get(k)||{resourceId:a.resourceId,resourceCode:a.resourceCode,resourceName:a.resourceName,resourceType:a.resourceType,productionDate:a.productionDate,minutes:0,items:0,capacity:resourceCapacity(a)};x.minutes+=Number(a.plannedWorkMinutes);x.items++;map.set(k,x)}const rows=paginate([...map.values()]);$("explain").textContent="资源负荷按人员/工作单元和日期聚合；人员是否存在具体任务，可通过类型 PERSON 识别。";$("content").innerHTML=rows.length?table(["资源","类型","日期","计划分钟","可用分钟","利用率","任务数"],rows.map(a=>[`${a.resourceName} · ${a.resourceCode}`,a.resourceType,a.productionDate,Math.round(a.minutes*1000)/1000,a.capacity,`${Math.round(a.minutes/a.capacity*100)}%`,a.items])):'<div class="empty">没有负荷记录</div>'}
function shortages(p){const rows=paginate(p.shortages);$("explain").textContent="能力缺口表示在当前工作日窗口、能力和约束下未能排入的任务，不会被算法静默丢弃。";$("content").innerHTML=rows.length?table(["工单","工序","工作中心","剩余数量","剩余分钟","交期","原因"],rows.map(a=>[a.workOrderCode,`${a.operationSequence} · ${a.operationName}`,a.workCenterId,a.remainingQuantity,a.remainingWorkMinutes,a.dueAt,a.reason])):'<div class="empty">当前方案没有能力缺口</div>'}function evidence(p){const gp=p.generationParameters;$("explain").textContent="这里解释方案怎样计算，不代表大模型拥有排产写权限。";$("content").innerHTML=`<div style="padding:18px"><h3>排产计算依据</h3><p>需求公式：${esc(gp.workDemandFormula||"剩余数量 × 单件工时")}</p><p>算法：${esc(gp.algorithm)}；工作日历：${esc(gp.workingCalendar)}；加班：${p.useOvertime?"启用":"未启用"}</p><p>工序优先使用快照中的单件工时与准备工时；缺失时才使用工序覆盖或默认值 ${gp.defaultMinutesPerUnit} 分钟。</p><p class="muted">输入指纹：${esc(gp.inputFingerprint||"人工计划，无 Agent 指纹")}</p></div>`}function table(head,data){return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${data.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.tab=b.dataset.tab;state.page=1;renderContent()});$("search").oninput=()=>{state.q=$("search").value;state.page=1;renderContent()};$("prev").onclick=()=>{state.page--;renderContent()};$("next").onclick=()=>{state.page++;renderContent()};$("plan").onchange=()=>{state.current=state.plans.find(p=>p.planId===$("plan").value);state.page=1;render()};$("refresh").onclick=()=>load().catch(e=>msg(e.message,true));$("actor").onchange=()=>{sessionStorage.setItem("mes_dev_actor",$("actor").value);load().catch(e=>msg(e.message,true))};init().catch(e=>msg(e.message,true));
{const nav=document.querySelector("header .row"),link=document.createElement("a");link.className="btn";link.href="/settings/models";link.textContent="模型设置";nav.insertBefore(link,nav.querySelector(".identity-select"));}
</script></body></html>
